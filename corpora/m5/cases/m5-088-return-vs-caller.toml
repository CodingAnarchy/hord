[resolution]
"src/lib.rs" = """
pub fn parse_slot(s: &str) -> Result<u32, String> {
    s.parse().map_err(|e: std::num::ParseIntError| e.to_string())
}

pub fn is_slot(s: &str) -> bool {
    parse_slot(s).is_ok()
}
"""
