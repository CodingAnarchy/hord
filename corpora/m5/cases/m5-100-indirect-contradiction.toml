test_path = "tests/m5_a.rs"
test_source = """
#[test]
fn queue_rejects_the_201st_job() {
    let mut all = fixture::JobQueue::new();
    for i in 0..200 {
        all.enqueue(i).expect("room for 200");
    }
    assert!(all.enqueue(200).is_err(), "the 201st job is rejected");
}
"""

