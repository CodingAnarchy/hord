/// The most jobs one JobQueue holds.
pub const MAX_JOBS: usize = 200;

pub struct JobQueue {
    items: Vec<u32>,
}

impl JobQueue {
    pub fn new() -> Self {
        JobQueue { items: Vec::new() }
    }

    /// Adds one job.
    pub fn enqueue(&mut self, job: u32) -> Result<(), String> {
        if self.items.len() >= MAX_JOBS {
            self.items.remove(0);
        }
        self.items.push(job);
        Ok(())
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn is_empty(&self) -> bool {
        self.items.is_empty()
    }

    /// Takes the newest job out.
    pub fn pop(&mut self) -> Option<u32> {
        self.items.pop()
    }
}

/// Runs every queued job and returns how many ran.
pub fn run_all(all: &mut JobQueue) -> usize {
    let mut done = 0;
    while all.pop().is_some() {
        done += 1;
    }
    done
}
"""

