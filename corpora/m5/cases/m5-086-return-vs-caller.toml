pub fn parse_limit(s: &str) -> Result<u32, String> {
    s.parse().map_err(|e: std::num::ParseIntError| e.to_string())
}

pub fn is_limit(s: &str) -> bool {
    parse_limit(s).is_ok()
}
"""
