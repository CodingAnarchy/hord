"src/lib.rs" = """
pub fn parse_id(s: &str) -> Result<u32, String> {
    s.parse().map_err(|e: std::num::ParseIntError| e.to_string())
}

pub fn is_id(s: &str) -> bool {
    parse_id(s).is_ok()
}
"""
