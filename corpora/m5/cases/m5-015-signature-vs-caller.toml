[resolution]
"src/lib.rs" = """
pub fn weigh(x: u32, factor: u32) -> u32 {
    x * factor
}

pub fn weigh_twice(x: u32) -> u32 {
    weigh(weigh(x, 2), 2)
}

pub fn weigh_padded(x: u32) -> u32 {
    weigh(x, 2) + 1
}
"""
