/// The numbers in one CSV row. Every cell must hold a number.
pub fn parse_row(line: &str) -> Result<Vec<u32>, String> {
    line.split(',')
        .map(str::trim)
        .map(|cell| {
            if cell.is_empty() {
                return Err("blank cell".to_owned());
            }
            cell.parse().map_err(|e| format!("{cell:?}: {e}"))
        })
        .collect()
}

/// The total of one imported row.
pub fn import_total(line: &str) -> Result<u32, String> {
    let mut total = 0;
    for cell in line.split(',').map(str::trim).filter(|c| !c.is_empty()) {
        total += cell.parse::<u32>().map_err(|e| format!("{cell:?}: {e}"))?;
    }
    Ok(total)
}
"""

