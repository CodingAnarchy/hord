[[tasks]]
name = "a"
summary = "cap undo history at 100 edits"
body = "Long editing sessions grow the undo history without bound, and the editor runs out of memory on large documents. Cap History at 100 edits: record returns an error once it is full, so the editor can tell the user."
test = "history_holds_at_most_100_edits"
test_path = "tests/m5_a.rs"
test_source = """
#[test]
fn history_holds_at_most_100_edits() {
    let mut all = fixture::History::new();
    for i in 0..100 {
        all.record(i).expect("room for 100");
    }
    assert!(all.record(100).is_err(), "the 101st edit is rejected");
}
"""

[tasks.files]
"src/lib.rs" = """
/// The most edits one History holds.
pub const MAX_EDITS: usize = 100;

pub struct History {
    items: Vec<u32>,
}

impl History {
    pub fn new() -> Self {
        History { items: Vec::new() }
    }

    /// Adds one edit.
    pub fn record(&mut self, edit: u32) -> Result<(), String> {
        if self.items.len() >= MAX_EDITS {
            return Err(format!("full: {} edits", MAX_EDITS));
        }
        self.items.push(edit);
        Ok(())
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn is_empty(&self) -> bool {
        self.items.is_empty()
    }

    /// Takes the newest edit out.
    pub fn pop(&mut self) -> Option<u32> {
        self.items.pop()
    }
}
"""

[[tasks]]
name = "b"
summary = "add undo_all to revert a whole session"
body = "Users want to throw away a whole editing session in one step. Add undo_all(history), which undoes every recorded edit and returns how many it undid. Sessions of 150 edits are common in our telemetry, and every edit in them has to be recorded and undoable."
