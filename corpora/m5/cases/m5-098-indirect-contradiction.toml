pub struct History {
    items: Vec<u32>,
}

impl History {
    pub fn new() -> Self {
        History { items: Vec::new() }
    }

    /// Adds one edit.
    pub fn record(&mut self, edit: u32) -> Result<(), String> {
        self.items.push(edit);
        Ok(())
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn is_empty(&self) -> bool {
        self.items.is_empty()
    }

    /// Takes the newest edit out.
    pub fn pop(&mut self) -> Option<u32> {
        self.items.pop()
    }
}

/// Undoes every recorded edit, newest first, and returns how many it undid.
pub fn undo_all(all: &mut History) -> usize {
    let mut done = 0;
    while all.pop().is_some() {
        done += 1;
    }
    done
}
