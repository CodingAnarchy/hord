test_path = "tests/m5_b.rs"
test_source = """
#[test]
fn undo_all_reverts_a_150_edit_session() {
    let mut all = fixture::History::new();
    for i in 0..150 {
        all.record(i).expect("a long session records every edit");
    }
    assert_eq!(fixture::undo_all(&mut all), 150);
}
"""

