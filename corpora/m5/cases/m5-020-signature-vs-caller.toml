[resolution]
"src/lib.rs" = """
pub fn area(x: u32, factor: u32) -> u32 {
    x * factor
}

pub fn area_twice(x: u32) -> u32 {
    area(area(x, 2), 2)
}

pub fn area_with_border(x: u32) -> u32 {
    area(x, 2) + 1
}
"""
