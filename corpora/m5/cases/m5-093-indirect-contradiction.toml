"src/lib.rs" = """
/// Seconds in a duration such as `90s` or `2m`. The unit is required.
pub fn parse_duration(text: &str) -> Result<u64, String> {
    let text = text.trim();
    let (number, unit) = if let Some(number) = text.strip_suffix('m') {
        (number, 60)
    } else if let Some(number) = text.strip_suffix('s') {
        (number, 1)
    } else {
        return Err(format!("{text:?} has no unit (s or m)"));
    };
    number
        .parse::<u64>()
        .map(|n| n * unit)
        .map_err(|e| format!("{text:?}: {e}"))
}
"""

[[tasks]]
name = "b"
summary = "honor Retry-After headers"
body = "Upstream APIs tell us when to retry with a Retry-After header, which carries bare seconds (`Retry-After: 90`). Add retry_after(header). Every duration we act on goes through parse_duration so limits and logs treat them alike, and the retry scheduler logs parse_duration of the header next to the wait, so `90` has to read as 90 seconds both ways."
test = "retry_after_reads_bare_seconds"
test_path = "tests/m5_b.rs"
test_source = """
#[test]
fn retry_after_reads_bare_seconds() {
    assert_eq!(fixture::parse_duration("90"), Ok(90));
    assert_eq!(fixture::retry_after("90"), Ok(90));
}
"""

