/// Seconds in a duration such as `90s` or `2m`. A bare number is seconds.
pub fn parse_duration(text: &str) -> Result<u64, String> {
    let text = text.trim();
    let (number, unit) = match text.strip_suffix('m') {
        Some(number) => (number, 60),
        None => (text.strip_suffix('s').unwrap_or(text), 1),
    };
    number
        .parse::<u64>()
        .map(|n| n * unit)
        .map_err(|e| format!("{text:?}: {e}"))
}
"""

[[tasks]]
name = "a"
summary = "durations need a unit"
body = "`timeout = 5` in a config file meant five minutes to the person who wrote it and five seconds to us, and the outage lasted an afternoon. parse_duration should reject a number without a unit (s or m)."
test = "unitless_durations_are_rejected"
test_path = "tests/m5_a.rs"
test_source = """
#[test]
fn unitless_durations_are_rejected() {
    assert!(fixture::parse_duration("90").is_err());
}
"""

