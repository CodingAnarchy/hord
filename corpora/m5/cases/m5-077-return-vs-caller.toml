[resolution]
"src/lib.rs" = """
pub fn parse_port(s: &str) -> Result<u32, String> {
    s.parse().map_err(|e: std::num::ParseIntError| e.to_string())
}

pub fn is_port(s: &str) -> bool {
    parse_port(s).is_ok()
}
"""
