[resolution]
"src/lib.rs" = """
pub fn cost(x: u32, factor: u32) -> u32 {
    x * factor
}

pub fn cost_twice(x: u32) -> u32 {
    cost(cost(x, 2), 2)
}

pub fn cost_with_tax(x: u32) -> u32 {
    cost(x, 2) + 1
}
"""
"tests/m5_b.rs" = """
#[test]
fn cost_with_tax_is_one_more() {
    assert_eq!(fixture::cost_with_tax(4), 9);
}
"""
