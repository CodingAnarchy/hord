test_source = """
#[test]
fn inbox_rejects_the_51st_message() {
    let mut all = fixture::Inbox::new();
    for i in 0..50 {
        all.deliver(i).expect("room for 50");
    }
    assert!(all.deliver(50).is_err(), "the 51st message is rejected");
}
"""

