"src/lib.rs" = """
/// The most messages one Inbox holds.
pub const MAX_MESSAGES: usize = 50;

pub struct Inbox {
    items: Vec<u32>,
}

impl Inbox {
    pub fn new() -> Self {
        Inbox { items: Vec::new() }
    }

    /// Adds one message.
    pub fn deliver(&mut self, message: u32) -> Result<(), String> {
        if self.items.len() >= MAX_MESSAGES {
            return Err(format!("full: {} messages", MAX_MESSAGES));
        }
        self.items.push(message);
        Ok(())
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn is_empty(&self) -> bool {
        self.items.is_empty()
    }

    /// Takes the newest message out.
    pub fn pop(&mut self) -> Option<u32> {
        self.items.pop()
    }
}
"""

