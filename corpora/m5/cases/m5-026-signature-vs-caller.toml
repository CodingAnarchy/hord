[resolution]
"src/lib.rs" = """
pub fn dose(x: u32, factor: u32) -> u32 {
    x * factor
}

pub fn dose_twice(x: u32) -> u32 {
    dose(dose(x, 2), 2)
}

pub fn dose_extra(x: u32) -> u32 {
    dose(x, 2) + 1
}
"""
