[resolution]
"src/lib.rs" = """
pub fn stretch(x: u32, factor: u32) -> u32 {
    x * factor
}

pub fn stretch_twice(x: u32) -> u32 {
    stretch(stretch(x, 2), 2)
}

pub fn stretch_once_more(x: u32) -> u32 {
    stretch(x, 2) + 1
}
"""
