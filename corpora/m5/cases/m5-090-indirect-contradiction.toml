"src/lib.rs" = """
/// The largest percent accepted.
pub const MAX_DISCOUNT: u32 = 100;

/// Checks a discount percentage. Checkout runs this again on every coupon it redeems.
pub fn validate_discount(percent: u32) -> Result<u32, String> {
    if percent == 100 {
        return Err("a 100% discount is a comp, not a coupon".to_owned());
    }
    if percent > MAX_DISCOUNT {
        return Err(format!("percent {percent} is over {MAX_DISCOUNT}"));
    }
    Ok(percent)
}

pub struct Coupon {
    pub code: String,
    pub percent: u32,
}

pub fn issue_coupon(code: &str, percent: u32) -> Result<Coupon, String> {
    let percent = validate_discount(percent)?;
    Ok(Coupon {
        code: code.to_owned(),
        percent,
    })
}
"""

