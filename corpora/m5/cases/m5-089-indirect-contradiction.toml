/// The largest quantity accepted.
pub const MAX_QUANTITY: u32 = 1_000;

/// Checks an order quantity. Fulfillment runs this again on every order it receives.
pub fn validate_quantity(quantity: u32) -> Result<u32, String> {
    if quantity > MAX_QUANTITY {
        return Err(format!("quantity {quantity} is over {MAX_QUANTITY}"));
    }
    Ok(quantity)
}

pub struct Order {
    pub sku: String,
    pub quantity: u32,
}

pub fn place_order(sku: &str, quantity: u32) -> Result<Order, String> {
    let quantity = validate_quantity(quantity)?;
    Ok(Order {
        sku: sku.to_owned(),
        quantity,
    })
}
"""

[[tasks]]
name = "a"
summary = "reject orders for zero units"
body = "An order line for 0 units is always a client bug: the storefront never means it, and it reaches the warehouse as an empty box. Make validate_quantity reject a quantity of 0 so these orders fail at checkout instead."
test = "zero_quantity_is_rejected"
test_path = "tests/m5_a.rs"
test_source = """
#[test]
fn zero_quantity_is_rejected() {
    assert!(fixture::validate_quantity(0).is_err());
}
"""

[tasks.files]
