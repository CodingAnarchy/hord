/// The largest quantity accepted.
pub const MAX_QUANTITY: u32 = 1_000;

/// Checks an order quantity. Fulfillment runs this again on every order it receives.
pub fn validate_quantity(quantity: u32) -> Result<u32, String> {
    if quantity == 0 {
        return Err("quantity must be at least 1".to_owned());
    }
    if quantity > MAX_QUANTITY {
        return Err(format!("quantity {quantity} is over {MAX_QUANTITY}"));
    }
    Ok(quantity)
}

pub struct Order {
    pub sku: String,
    pub quantity: u32,
}

pub fn place_order(sku: &str, quantity: u32) -> Result<Order, String> {
    let quantity = validate_quantity(quantity)?;
    Ok(Order {
        sku: sku.to_owned(),
        quantity,
    })
}
"""

[[tasks]]
name = "b"
summary = "add place_hold: reserve a SKU without shipping it"
body = "Sales wants to hold stock for a customer before they commit to buying. Model a hold as an order for zero units: add place_hold(sku), which places an order for 0 of the SKU. Fulfillment re-runs validate_quantity on every order it receives, so a hold has to pass it like any other order."
test = "a_hold_is_a_valid_zero_unit_order"
test_path = "tests/m5_b.rs"
test_source = """
#[test]
fn a_hold_is_a_valid_zero_unit_order() {
    let made = fixture::place_hold("sku-1").expect("a hold is an order for zero units");
    assert_eq!(made.quantity, 0);
    assert!(fixture::validate_quantity(made.quantity).is_ok(), "fulfillment re-validates every order");
}
"""

