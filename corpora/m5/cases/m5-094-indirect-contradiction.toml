/// A `major.minor.patch` version. All three parts are required.
pub fn parse_version(text: &str) -> Result<(u32, u32, u32), String> {
    let mut parts = text
        .trim()
        .split('.')
        .map(|p| p.parse::<u32>().map_err(|e| format!("{text:?}: {e}")));
    let mut next = || {
        parts
            .next()
            .unwrap_or_else(|| Err(format!("{text:?} is not major.minor.patch")))
    };
    let version = (next()?, next()?, next()?);
    if next().is_ok() {
        return Err(format!("{text:?} has more than three parts"));
    }
    Ok(version)
}

/// Whether `found` meets the requirement `required`: the same major
/// version, and no older.
pub fn satisfies(required: &str, found: &str) -> Result<bool, String> {
    let padded = |text: &str| {
        let text = text.trim();
        match text.matches('.').count() {
            0 => format!("{text}.0.0"),
            1 => format!("{text}.0"),
            _ => text.to_owned(),
        }
    };
    let (required, found) = (
        parse_version(&padded(required))?,
        parse_version(&padded(found))?,
    );
    Ok(required.0 == found.0 && found >= required)
}
