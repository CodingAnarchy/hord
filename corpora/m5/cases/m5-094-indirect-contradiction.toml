/// A `major.minor.patch` version. Missing parts are 0.
pub fn parse_version(text: &str) -> Result<(u32, u32, u32), String> {
    let mut parts = text
        .trim()
        .split('.')
        .map(|p| p.parse::<u32>().map_err(|e| format!("{text:?}: {e}")));
    let major = parts.next().unwrap_or(Ok(0))?;
    let minor = parts.next().unwrap_or(Ok(0))?;
    let patch = parts.next().unwrap_or(Ok(0))?;
    if parts.next().is_some() {
        return Err(format!("{text:?} has more than three parts"));
    }
    Ok((major, minor, patch))
}

/// Whether `found` meets the requirement `required`: the same major
/// version, and no older.
pub fn satisfies(required: &str, found: &str) -> Result<bool, String> {
    let (required, found) = (parse_version(required)?, parse_version(found)?);
    Ok(required.0 == found.0 && found >= required)
}
"""

