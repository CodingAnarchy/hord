[resolution]
"src/lib.rs" = """
pub fn price(x: u32, factor: u32) -> u32 {
    x * factor
}

pub fn price_twice(x: u32) -> u32 {
    price(price(x, 2), 2)
}

pub fn price_with_fee(x: u32) -> u32 {
    price(x, 2) + 1
}
"""
"tests/m5_b.rs" = """
#[test]
fn price_with_fee_is_one_more() {
    assert_eq!(fixture::price_with_fee(4), 9);
}
"""
