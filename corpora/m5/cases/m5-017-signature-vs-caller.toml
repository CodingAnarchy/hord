[resolution]
"src/lib.rs" = """
pub fn mult(x: u32, factor: u32) -> u32 {
    x * factor
}

pub fn mult_twice(x: u32) -> u32 {
    mult(mult(x, 2), 2)
}

pub fn mult_and_bump(x: u32) -> u32 {
    mult(x, 2) + 1
}
"""
"tests/m5_b.rs" = """
#[test]
fn mult_and_bump_is_one_more() {
    assert_eq!(fixture::mult_and_bump(4), 9);
}
"""
