# DO NOT MERGE: which of PID namespace / environment protects the runner?
name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  hang:
    name: linux gate (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [ns-stripped, nons-stripped, ns-fullenv]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dbg
      - name: tools and environment
        run: |
          sudo apt-get install -y strace >/dev/null
          echo "--- CARGO/RUST env:"; env | grep -E '^(CARGO|RUST)' | sort
      - name: build
        run: cargo test -p hord-txn --test gate --no-run 2>&1 | tail -2
      - name: loop
        run: |
          bin=$(ls -t target/debug/deps/gate-* | grep -v '[.]d$' | head -1)
          case "${{ matrix.variant }}" in
            ns-stripped)   pre="sudo unshare --pid --fork --mount-proc sudo -u $USER --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME" ;;
            nons-stripped) pre="sudo -u $USER --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME" ;;
            ns-fullenv)    pre="sudo --preserve-env unshare --pid --fork --mount-proc sudo --preserve-env -u $USER" ;;
          esac
          echo "prefix: $pre"
          for i in $(seq 1 15); do
            start=$(date +%s)
            $pre strace -f -qq -e trace=kill,tkill,tgkill -o /tmp/kills.$i.log timeout 600 "$bin" > /tmp/run.$i.log 2>&1
            rc=$?
            echo "ITER $i rc=$rc $(( $(date +%s) - start ))s $(grep 'test result' /tmp/run.$i.log)"
            sed 's/^/   KILL /' /tmp/kills.$i.log | head -8
            [ $rc -ne 0 ] && tail -40 /tmp/run.$i.log
          done
