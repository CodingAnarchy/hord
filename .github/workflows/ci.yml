# M0–M5 acceptance (spec §12): unit tests and encoding goldens on
# Linux/macOS/Windows; git round-trip, M1, M2, M3, and M5 corpora on Ubuntu.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A stuck test should fail the job, not run until GitHub's 6 h limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: doc
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: M0 eval (hord)
        run: cargo run -p hord-eval --release -- --only hord --json

      - name: M1 merge corpus
        # 61 single-definition git resolutions (ADR 0006): ≥70% auto,
        # 100% parse, ≥95% label match.
        run: cargo run -p hord-eval-m1 --release -- --merges-only

  eval:
    name: M0 corpora
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: M0 eval (hord, cargo, tokio)
        run: cargo run -p hord-eval --release -- --json

  m1:
    name: M1 corpora
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: M1 lossless HEAD
        run: cargo run -p hord-eval-m1 --release -- --lossless-only --skip-merges

      - name: M1 consecutive apply(diff)
        run: cargo run -p hord-eval-m1 --release -- --pairs-only --skip-merges

  m2:
    name: M2 corpora
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: Fetch cargo corpus
        # hord-eval bare-clones cargo into the corpus cache when it is missing
        # (and re-checks its round trip); the M2 harness only reads the cache.
        run: cargo run -p hord-eval --release -- --only cargo

      - name: M2 identity, references, blame
        # Identity stability and rename precision over cargo history, syntactic
        # reference recall (ADR 0011), and warm blame latency. rust-analyzer's
        # find-references is informational (ADR 0011) and needs the binary plus
        # network for cargo metadata, so CI skips it.
        run: cargo run -p hord-eval-m2 --release -- --skip-rust-analyzer

  m3:
    name: M3 concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: Fetch cargo corpus
        run: cargo run -p hord-eval --release -- --only cargo

      # Shared runners vary 2-3x in speed between runs (24.5/s, then 10.0/s, on
      # the same code), so CI gates every correctness check and only reports
      # throughput. The 20/s throughput gate is checked on the reference
      # machine before a milestone merges.
      - name: M3 simulation (seed 42)
        # 100 agents on cargo: zero false negatives, false-positive rate,
        # disjoint changes landed without replay, workspaces, and concurrent
        # Cargo.lock additions.
        run: cargo run -p hord-eval-m3 --release -- --seed 42 --report-throughput

      - name: M3 simulation (completion-order submits)
        run: cargo run -p hord-eval-m3 --release -- --racy-submit --report-throughput

      - name: M3 simulation (changes proposed in another process)
        run: cargo run -p hord-eval-m3 --release -- --remote-submit --report-throughput

      - name: M3 simulation against a spawned server (100 clients, flight recording)
        run: cargo run -p hord-eval-m3 --release -- --server --report-throughput

      - name: M3 simulation with section 7.2 policy enforced
        run: cargo run -p hord-eval-m3 --release -- --policy --report-throughput

      - name: M3 simulation with policy, against the server
        run: cargo run -p hord-eval-m3 --release -- --server --policy --report-throughput

  m5:
    name: M5 conflict corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # The lander's verifier runs each case's tests under coverage
      # (ADR 0022).
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build hord, the reference harness, and the runner
        run: cargo build --release -p hord-cli -p hord-replay-ref -p hord-eval-m5

      # 100 intent-bearing conflict cases through the escalation ladder,
      # with hord-replay-ref running the deterministic scripted harness.
      # Gates correctness only: every case collides as designed, no attempt
      # runs past its budget unkilled and no over-budget result is
      # accepted, every parked case is resolved from the web workbench (a
      # signed Arbitrate the UI sends), and each case is graded as its
      # script predicts. The 60%
      # resolved-by-replay target needs a model and is reported, not gated.
      - name: M5 conflict corpus (scripted harness)
        run: target/release/hord-eval-m5 run --jobs 4 --out target/m5-eval

      - name: Upload the review sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-review-sheet
          path: |
            target/m5-eval/report.json
            target/m5-eval/review.md
            target/m5-eval/review.csv
