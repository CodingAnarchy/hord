# DO NOT MERGE: Windows daemon store-lock diagnostic.
name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  win:
    name: windows daemon diagnostic
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo test -p hord-cli --test daemon --no-run
      - name: run five times
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "===== RUN $i"
            cargo test -q -p hord-cli --test daemon the_daemon_serves_workspaces_and_lands_on_submit -- --nocapture 2>&1 | grep -E "DIAG|panicked|test result|hord daemon|listening|\"hord.exe\"|Image Name|^  " | head -60
          done
