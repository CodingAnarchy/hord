# M0–M3 acceptance (spec §12): unit tests and encoding goldens on
# Linux/macOS/Windows; git round-trip, M1, M2, and M3 corpora on Ubuntu.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: doc
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: M0 eval (hord)
        run: cargo run -p hord-eval --release -- --only hord --json

      - name: M1 merge corpus
        # 61 single-definition git resolutions (ADR 0006): ≥70% auto,
        # 100% parse, ≥95% label match.
        run: cargo run -p hord-eval-m1 --release -- --merges-only

  eval:
    name: M0 corpora
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: M0 eval (hord, cargo, tokio)
        run: cargo run -p hord-eval --release -- --json

  m1:
    name: M1 corpora
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: M1 lossless HEAD
        run: cargo run -p hord-eval-m1 --release -- --lossless-only --skip-merges

      - name: M1 consecutive apply(diff)
        run: cargo run -p hord-eval-m1 --release -- --pairs-only --skip-merges

  m2:
    name: M2 corpora
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: Fetch cargo corpus
        # hord-eval bare-clones cargo into the corpus cache when it is missing
        # (and re-checks its round trip); the M2 harness only reads the cache.
        run: cargo run -p hord-eval --release -- --only cargo

      - name: M2 identity, references, blame
        # Identity stability and rename precision over cargo history, syntactic
        # reference recall (ADR 0011), and warm blame latency. rust-analyzer's
        # find-references is informational (ADR 0011) and needs the binary plus
        # network for cargo metadata, so CI skips it.
        run: cargo run -p hord-eval-m2 --release -- --skip-rust-analyzer

  m3:
    name: M3 concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: Fetch cargo corpus
        run: cargo run -p hord-eval --release -- --only cargo

      - name: M3 simulation (seed 42)
        # 100 agents on cargo: throughput, zero false negatives, false-positive
        # rate, disjoint changes landed without replay, workspaces, and the
        # concurrent Cargo.lock additions.
        run: cargo run -p hord-eval-m3 --release -- --seed 42

      - name: M3 simulation (completion-order submits)
        run: cargo run -p hord-eval-m3 --release -- --racy-submit

      - name: M3 simulation (changes proposed in another process)
        # Report only. Not a spec §12 gate: validation of changes from another
        # process scales with cores (35/s on 10 cores, ~15/s on these 4-vCPU
        # runners). M4 sets the remote-throughput gate against the real server.
        continue-on-error: true
        run: cargo run -p hord-eval-m3 --release -- --remote-submit
