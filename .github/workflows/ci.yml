# DO NOT MERGE: catch the hord-txn gate hang with thread backtraces.
name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  hang:
    name: linux gate hang hunt
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dbg
      - name: tools
        run: sudo apt-get install -y gdb strace >/dev/null && strace -V | head -1
      - name: build
        run: cargo test -p hord-txn --test gate --no-run 2>&1 | tail -3
      - name: loop in a PID namespace, tracing kill signals
        run: |
          bin=$(ls -t target/debug/deps/gate-* | grep -v '\.d$' | head -1)
          echo "binary: $bin"
          for i in $(seq 1 25); do
            start=$(date +%s)
            sudo unshare --pid --fork --mount-proc \
              sudo -u "$USER" --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME \
              strace -f -qq -e trace=kill,tkill,tgkill -o /tmp/kills.$i.log \
              timeout 600 "$bin" > /tmp/run.$i.log 2>&1
            rc=$?
            echo "iteration $i rc=$rc in $(( $(date +%s) - start ))s $(grep 'test result' /tmp/run.$i.log)"
            echo "  kill syscalls: $(wc -l < /tmp/kills.$i.log); group or broadcast kills:"
            grep -E 'kill\(-[0-9]+|kill\(0,|kill\(-1,' /tmp/kills.$i.log | head -10 | sed 's/^/    /'
            if [ $rc -ne 0 ]; then
              echo "::group::iteration $i output"; tail -80 /tmp/run.$i.log; echo "::endgroup::"
              echo "::group::iteration $i kill syscalls"; cat /tmp/kills.$i.log | head -200; echo "::endgroup::"
            fi
          done
