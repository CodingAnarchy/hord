# M0 + M1 acceptance (spec §12): unit tests and encoding goldens on
# Linux/macOS/Windows; git round-trip and M1 corpora on Ubuntu.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: doc
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: M0 eval (hord)
        run: cargo run -p hord-eval --release -- --only hord --json

      - name: M1 merge corpus
        # Auto-resolve is above 70%. Label match is not: only byte-equal,
        # trivia-stripped, or same definition `normalized` count (ADR 0005).
        # Name presence is not a match. Required once that gate passes.
        continue-on-error: true
        run: cargo run -p hord-eval-m1 --release -- --merges-only

  eval:
    name: M0 corpora
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: M0 eval (hord, cargo, tokio)
        run: cargo run -p hord-eval --release -- --json

  m1:
    name: M1 corpora
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache git corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/hord/corpora
          key: hord-corpora-v1

      - name: M1 lossless HEAD
        run: cargo run -p hord-eval-m1 --release -- --lossless-only --skip-merges

      - name: M1 consecutive apply(diff)
        run: cargo run -p hord-eval-m1 --release -- --pairs-only --skip-merges
