[package]
name = "hord-api"
description = "hord.proto (the one API schema), generated gRPC types and stubs, and the RepoBackend trait (spec §10.5, ADR 0024)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The RepoBackend conformance suite, for implementations' tests.
conformance = ["tokio/time"]

[dependencies]
async-trait.workspace = true
blake3.workspace = true
hord-core.workspace = true
hord-encoding.workspace = true
pbjson.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
pbjson-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true
