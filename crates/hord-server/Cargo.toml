[package]
name = "hord-server"
description = "hord serve: gRPC and gRPC-Web over LocalRepo, one lander per repository, webhooks (spec §10.5, ADR 0024)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
async-trait.workspace = true
axum.workspace = true
blake3.workspace = true
bytes.workspace = true
getrandom.workspace = true
hex.workspace = true
hord-api.workspace = true
hord-core.workspace = true
hord-encoding.workspace = true
hord-store.workspace = true
hord-txn.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
toml.workspace = true
tonic.workspace = true
tonic-web.workspace = true
tower.workspace = true

[dev-dependencies]
hord-api = { workspace = true, features = ["conformance"] }
