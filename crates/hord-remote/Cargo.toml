[package]
name = "hord-remote"
description = "RemoteRepo: a gRPC client implementing RepoBackend and hord-txn's ObjectSource, with lazy fetch (spec §8.3, ADR 0024)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
hord-api.workspace = true
hord-core.workspace = true
hord-encoding.workspace = true
hord-store.workspace = true
hord-txn.workspace = true
http.workspace = true
hyper-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true

[dev-dependencies]
axum.workspace = true
bytes.workspace = true
hord-api = { workspace = true, features = ["conformance"] }
hord-server.workspace = true
hord-ui.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
prost.workspace = true
serde_json.workspace = true
