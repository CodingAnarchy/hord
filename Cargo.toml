[workspace]
resolver = "3"
members = [
    "crates/hord-encoding",
    "crates/hord-core",
    "crates/hord-store",
    "crates/hord-git",
    "crates/hord-cli",
    "crates/hord-lang",
    "crates/hord-lang-rust",
    "crates/hord-lang-toml",
    "crates/hord-diff",
    "crates/hord-identity",
    "crates/hord-txn",
    "crates/hord-api",
    "crates/hord-server",
    "crates/hord-remote",
    "crates/hord-policy",
    "crates/hord-verify",
    "crates/hord-verify-rust",
    "crates/hord-ui",
    "bench/m0-eval",
    "bench/m1-eval",
    "bench/m2-eval",
    "bench/m3-eval",
    "bench/m4-eval",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
askama = "0.16"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
cbor2 = "1.1"
clap = { version = "4", features = ["derive"] }
diffy = "0.4"
ed25519-dalek = { version = "3", features = ["pem"] }
getrandom = "0.4"
gix = "0.87"
globset = "0.4"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hord-api = { path = "crates/hord-api" }
hord-core = { path = "crates/hord-core" }
hord-diff = { path = "crates/hord-diff" }
hord-encoding = { path = "crates/hord-encoding" }
hord-git = { path = "crates/hord-git" }
hord-identity = { path = "crates/hord-identity" }
hord-lang = { path = "crates/hord-lang" }
hord-lang-rust = { path = "crates/hord-lang-rust" }
hord-lang-toml = { path = "crates/hord-lang-toml" }
hord-remote = { path = "crates/hord-remote" }
hord-server = { path = "crates/hord-server" }
hord-policy = { path = "crates/hord-policy" }
hord-store = { path = "crates/hord-store" }
hord-txn = { path = "crates/hord-txn" }
hord-ui = { path = "crates/hord-ui" }
hord-verify = { path = "crates/hord-verify" }
hord-verify-rust = { path = "crates/hord-verify-rust" }
ignore = "0.4"
pbjson = "0.9"
pbjson-build = "0.9"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
lasso = { version = "0.7", features = ["multi-threaded"] }
proptest = "1"
semver = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
# crates.io `tree-sitter-toml` is frozen at 0.20 (tree-sitter 0.20). The
# maintained grammar (tree-sitter-grammars/tree-sitter-toml) publishes as
# `tree-sitter-toml-ng` 0.7, which matches this pin and tree-sitter 0.25.
tree-sitter-toml = { package = "tree-sitter-toml-ng", version = "0.7" }
redb = "2"
rustc-demangle = "0.1"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
toml = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-web = "0.14"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
ulid = "3"
zstd = "0.13"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
